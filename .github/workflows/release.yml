name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish win-x64 single-file
        shell: pwsh
        run: |
          dotnet publish src/CodexHistorySync.Cli `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o artifacts/win-x64
          if (-not (Test-Path "artifacts/win-x64/codex-sync.exe")) {
            throw "Publish output missing codex-sync.exe"
          }

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "artifacts/win-x64/codex-sync.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          "$hash  codex-sync.exe" | Set-Content -Path "artifacts/win-x64/codex-sync.exe.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"
          Get-Item $exe | Format-List FullName, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/win-x64/codex-sync.exe
            artifacts/win-x64/codex-sync.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
