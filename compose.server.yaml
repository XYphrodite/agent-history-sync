name: agent-sync
services:
  api:
    image: agent-sync-server:local
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      # Never replace this with 0.0.0.0; see docs/server.md before exposing on Tailscale.
      - "${AGENT_SYNC_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      Storage__AllowedHosts: "127.0.0.1;localhost;${AGENT_SYNC_BIND_IP:-127.0.0.1}"
      Storage__PasswordFile: /run/secrets/postgres_password
      Storage__DatabaseHost: postgres
      Storage__Database: agent_sync
      Storage__DatabaseUser: agent_sync
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks: [storage, api_ingress]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  postgres:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_sync
      POSTGRES_USER: agent_sync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_sync -d agent_sync"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt: [no-new-privileges:true]
networks:
  storage:
    internal: true
  # A published API port needs a non-internal network; only the API joins this one.
  api_ingress: {}
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: "${AGENT_SYNC_DB_PASSWORD_FILE:-./.secrets/postgres_password}"
